name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0

      - name: Restore dependencies
        run: dotnet restore dotnet-git-tool.slnx

      - name: Build
        run: dotnet build dotnet-git-tool.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet-git-tool.slnx --configuration Release --no-build --no-restore

      - name: Package tool
        run: >-
          dotnet pack src/DotnetGitTool/DotnetGitTool.csproj
          --configuration Release
          --no-restore
          --output artifacts

      - name: Upload NuGet tool package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dotnet-git-tool-nuget
          path: artifacts/*.nupkg
          if-no-files-found: error

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.semVer }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Resolve package version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Restore dependencies
        run: dotnet restore dotnet-git-tool.slnx

      - name: Build
        run: dotnet build dotnet-git-tool.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet-git-tool.slnx --configuration Release --no-build --no-restore

      - name: Package tool
        run: >-
          dotnet pack src/DotnetGitTool/DotnetGitTool.csproj
          --configuration Release
          --no-restore
          --output artifacts
          -p:Version=${{ steps.version.outputs.semVer }}

      - name: Upload NuGet tool package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: JKToolKit.Git.Tool-${{ steps.version.outputs.semVer }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-package
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet tool package
        uses: actions/download-artifact@v8.0.1
        with:
          name: JKToolKit.Git.Tool-${{ needs.build-test-package.outputs.package-version }}
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0

      - name: Exchange GitHub identity for a temporary NuGet API key
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: Weirdo

      - name: Publish package
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
